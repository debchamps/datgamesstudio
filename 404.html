<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Page Not Found | DAT Games Studio</title>
    <meta name="robots" content="noindex">
    <link rel="icon" type="image/png" href="/assets/img/icons/favicon.png">
    <link rel="stylesheet" href="/assets/styles.css?v=6">
    <script>
      // Daily Trick permalinks that haven't been generated yet open the game's daily page.
      (function () {
        var m = location.pathname.match(/^\/daily\/([a-z-]+)\/(\d+)\/?$/);
        if (m) location.replace("/daily/" + m[1] + "/?n=" + m[2] + location.search.replace(/^\?/, "&"));
      })();
    </script>
  </head>
  <body>
    <main class="policy-page">
      <section class="policy-hero">
        <div>
          <p class="eyebrow">DAT Games Studio</p>
          <h1>Page not found</h1>
          <p>The card you were looking for is not on this table.</p>
          <p><a class="button button-primary" href="/">Back to DAT Games Studio</a></p>
        </div>
      </section>
    </main>
  </body>
</html>
