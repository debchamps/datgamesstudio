<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Join Bray</title>
  <meta name="robots" content="noindex" />
  <!-- Invite landing page for Bray online rooms.
       Reached as https://www.datgamesstudio.com/join/bray?sessionId=ABC123
       Once the app's App Link is verified against /.well-known/assetlinks.json, Android
       opens the app directly and this page is never seen. It is the fallback for: a
       recipient without the app (Play button), an unverified install, and desktop/iOS. -->
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: linear-gradient(160deg, #0A1E3C 0%, #14406F 100%);
      min-height: 100vh; display: flex; align-items: center; justify-content: center;
      color: #fff; padding: 24px;
    }
    .card {
      background: rgba(255,255,255,0.08);
      border: 1px solid rgba(255,213,79,0.35);
      border-radius: 20px; padding: 40px 32px; max-width: 380px; width: 100%;
      text-align: center;
    }
    .suit-row { font-size: 2rem; margin-bottom: 12px; letter-spacing: 6px; }
    h1 { font-size: 1.75rem; font-weight: 700; color: #FFD54F; margin-bottom: 8px; }
    .invite-text { font-size: 1rem; color: rgba(255,255,255,0.75); margin-bottom: 28px; }
    .code-box {
      background: rgba(255,213,79,0.15); border: 2px dashed #FFD54F; border-radius: 12px;
      padding: 14px; margin-bottom: 28px; font-size: 0.85rem; color: rgba(255,255,255,0.7);
    }
    .code {
      font-size: 2.2rem; font-weight: 900; letter-spacing: 6px; color: #FFD54F;
      display: block; margin-top: 4px;
    }
    .btn {
      display: block; width: 100%; padding: 16px; border-radius: 12px; font-size: 1rem;
      font-weight: 700; cursor: pointer; text-decoration: none; border: none;
      margin-bottom: 12px; transition: opacity 0.2s;
    }
    .btn:active { opacity: 0.8; }
    .btn:focus-visible { outline: 3px solid #fff; outline-offset: 2px; }
    .btn-primary { background: #FFD54F; color: #0A1E3C; }
    .btn-secondary { background: transparent; color: #FFD54F; border: 2px solid #FFD54F; }
    .divider { color: rgba(255,255,255,0.35); font-size: 0.8rem; margin: 4px 0 12px; }
    .footer { margin-top: 24px; font-size: 0.75rem; color: rgba(255,255,255,0.35); }
  </style>
</head>
<body>
  <div class="card">
    <div class="suit-row">♠ ♥ ♦ ♣</div>
    <h1>Bray</h1>
    <p class="invite-text">You've been invited to play!</p>

    <div class="code-box">
      Game code
      <span class="code" id="gameCode">——</span>
    </div>

    <a class="btn btn-primary" id="openAppBtn" href="#">Open in app</a>
    <div class="divider">Don't have it yet?</div>
    <a class="btn btn-secondary"
       href="https://play.google.com/store/apps/details?id=com.datgames.bray"
       target="_blank" rel="noopener">
      Get Bray on Google Play
    </a>

    <p class="footer">
      Already have the app? Tap “Open in app”, or open Bray &rarr; More &rarr; Play with
      Friends &rarr; Join a Room and enter the code above.
    </p>
  </div>

  <script>
    var params = new URLSearchParams(window.location.search);
    var sessionId = (params.get('sessionId') || params.get('code') || '')
      .toUpperCase().replace(/[^A-Z0-9]/g, '').slice(0, 6);

    if (sessionId) {
      document.getElementById('gameCode').textContent = sessionId;
    }

    // Two ways into the app, in order of preference:
    //  1. the custom scheme, which works even when the App Link is not verified yet
    //     (fresh install, debug build signed with a cert not in assetlinks);
    //  2. failing that, this same https URL, which Android hands to the app once the
    //     domain IS verified.
    var btn = document.getElementById('openAppBtn');
    btn.href = sessionId ? 'bray://join/' + sessionId : window.location.href;
  </script>
</body>
</html>
